<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Request Diff</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1f2328; --muted: #656d76; --border: #d0d7de;
    --accent: #0969da; --accent-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8b949e; --border: #30363d; --accent: #2f81f7; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header, main { max-width: 1400px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 20px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  header p { margin: 0 0 16px; color: var(--muted); }
  .file { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  .file-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .file-head .name { font-family: ui-monospace, Consolas, monospace; }
  .reason { width: 100%; height: 70px; margin-top: 4px; border: 1px solid var(--border); border-radius: 6px; font: inherit; white-space: pre-wrap; background: var(--bg); }
  .reason-label { display: block; margin-top: 10px; font-weight: 600; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 760px) { .panels { grid-template-columns: 1fr; } }
  .panel { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; }
  .panel label { padding: 8px 12px; font-weight: 600; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; }
  .panel label small { font-weight: 400; color: var(--muted); }
  textarea { width: 100%; height: 240px; resize: vertical; border: 0; padding: 10px 12px; background: transparent; color: var(--text);
    font: 12.5px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre; overflow: auto; tab-size: 4; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 14px 0; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:hover { filter: brightness(.95); }
  .bar label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  input[type=text] { font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
  #report-wrap { display: none; margin: 8px 0 40px; }
  #actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  #status { color: var(--muted); }
  #report { background: #fff; color: #1f2328; border: 1px solid var(--border); border-radius: 6px; padding: 16px; overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>Change Request Diff Report</h1>
  <p>Add each changed file, paste its before and after code, give a reason, then generate one report for the change request.</p>
</header>
<main>
  <section class="file">
    <label class="reason-label" for="list" style="margin-top:0">File(s) changed <small style="font-weight:400;color:var(--muted)">&mdash; one per line</small></label>
    <textarea id="list" class="reason" style="height:90px;font-family:ui-monospace,Consolas,monospace" spellcheck="false" placeholder="src/app/config.js&#10;src/app/login.js"></textarea>
  </section>
  <div id="files"></div>

  <div class="bar">
    <button class="primary" id="go">Generate diff report</button>
    <button id="clear">Clear all</button>
    <label><input type="checkbox" id="ws"> Ignore whitespace changes</label>
  </div>

  <div id="report-wrap">
    <div id="report"></div>
    <div id="actions">
      <button id="copy-rich">Copy for change request</button>
      <button id="copy-md">Copy as Markdown</button>
      <button id="copy-patch">Copy as unified diff</button>
      <span id="status" role="status"></span>
    </div>
  </div>
</main>

<template id="tpl">
  <section class="file">
    <div class="file-head"><strong class="name"></strong></div>
    <div class="panels">
      <div class="panel"><label>Before <small class="ca"></small></label>
        <textarea class="a" spellcheck="false" placeholder="Paste original code here…"></textarea></div>
      <div class="panel"><label>After <small class="cb"></small></label>
        <textarea class="b" spellcheck="false" placeholder="Paste updated code here…"></textarea></div>
    </div>
  </section>
</template>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const CONTEXT = 3;
  let last = null; // array of { name, reason, hunks, adds, dels }

  const split = s => s === '' ? [] : s.replace(/\r\n?/g, '\n').replace(/\n$/, '').split('\n');
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Myers O(ND) diff on two arrays of comparable keys. Returns ops: {t:'=' | '-' | '+', i, j}
  function myers(a, b) {
    const N = a.length, M = b.length, max = N + M;
    if (max === 0) return [];
    const off = max + 1, v = new Int32Array(2 * max + 3), trace = [];
    let found = false;
    for (let d = 0; d <= max && !found; d++) {
      trace.push(v.slice());
      for (let k = -d; k <= d; k += 2) {
        let x = (k === -d || (k !== d && v[off + k - 1] < v[off + k + 1])) ? v[off + k + 1] : v[off + k - 1] + 1;
        let y = x - k;
        while (x < N && y < M && a[x] === b[y]) { x++; y++; }
        v[off + k] = x;
        if (x >= N && y >= M) { found = true; break; }
      }
    }
    const ops = [];
    let x = N, y = M;
    for (let d = trace.length - 1; d >= 0; d--) {
      const vv = trace[d], k = x - y;
      const pk = (k === -d || (k !== d && vv[off + k - 1] < vv[off + k + 1])) ? k + 1 : k - 1;
      const px = vv[off + pk], py = px - pk;
      while (x > px && y > py) { x--; y--; ops.push({ t: '=', i: x, j: y }); }
      if (d > 0) {
        if (x === px) { y--; ops.push({ t: '+', i: x, j: y }); }
        else { x--; ops.push({ t: '-', i: x, j: y }); }
      }
    }
    return ops.reverse();
  }

  function diffLines(A, B, ignoreWs) {
    const norm = s => ignoreWs ? s.trim().replace(/\s+/g, ' ') : s;
    const ka = A.map(norm), kb = B.map(norm);
    let s = 0;
    while (s < ka.length && s < kb.length && ka[s] === kb[s]) s++;
    let ea = ka.length, eb = kb.length;
    while (ea > s && eb > s && ka[ea - 1] === kb[eb - 1]) { ea--; eb--; }
    const ops = [];
    for (let i = 0; i < s; i++) ops.push({ t: '=', i, j: i });
    for (const o of myers(ka.slice(s, ea), kb.slice(s, eb))) ops.push({ t: o.t, i: o.i + s, j: o.j + s });
    for (let i = ea, j = eb; i < ka.length; i++, j++) ops.push({ t: '=', i, j });
    return ops.map(o => ({
      t: o.t, oldNo: o.t === '+' ? null : o.i + 1, newNo: o.t === '-' ? null : o.j + 1,
      text: o.t === '+' ? B[o.j] : A[o.i]
    }));
  }

  // Group rows into hunks with surrounding context, and compute intra-line highlights for paired -/+ lines.
  function buildHunks(rows) {
    const idx = [];
    rows.forEach((r, i) => { if (r.t !== '=') idx.push(i); });
    if (!idx.length) return [];
    const ranges = [];
    for (const i of idx) {
      const s = Math.max(0, i - CONTEXT), e = Math.min(rows.length - 1, i + CONTEXT);
      if (ranges.length && s <= ranges[ranges.length - 1][1] + 1) ranges[ranges.length - 1][1] = e;
      else ranges.push([s, e]);
    }
    return ranges.map(([s, e]) => {
      const rs = rows.slice(s, e + 1).map(r => ({ ...r }));
      pairHighlights(rs);
      const first = rs.find(r => r.oldNo), firstNew = rs.find(r => r.newNo);
      return {
        rows: rs,
        oldStart: first ? first.oldNo : 0, oldLen: rs.filter(r => r.oldNo).length,
        newStart: firstNew ? firstNew.newNo : 0, newLen: rs.filter(r => r.newNo).length
      };
    });
  }

  function pairHighlights(rs) {
    for (let i = 0; i < rs.length;) {
      if (rs[i].t !== '-') { i++; continue; }
      let d = i; while (d < rs.length && rs[d].t === '-') d++;
      let a = d; while (a < rs.length && rs[a].t === '+') a++;
      const n = Math.min(d - i, a - d);
      for (let k = 0; k < n; k++) {
        const o = rs[i + k], w = rs[d + k];
        let p = 0; while (p < o.text.length && p < w.text.length && o.text[p] === w.text[p]) p++;
        let q = 0; while (q < o.text.length - p && q < w.text.length - p && o.text[o.text.length - 1 - q] === w.text[w.text.length - 1 - q]) q++;
        o.hl = [p, o.text.length - q]; w.hl = [p, w.text.length - q];
      }
      i = a;
    }
  }

  const ST = {
    wrap: 'font-family:Consolas,Menlo,monospace;font-size:12px;border-collapse:collapse;width:100%;border:1px solid #d0d7de;margin:0 0 14px',
    hdr: 'background:#ddf4ff;color:#0550ae;padding:3px 8px;text-align:left;font-weight:normal',
    num: 'width:1%;min-width:40px;padding:0 8px;text-align:right;color:#656d76;vertical-align:top;user-select:none;white-space:nowrap',
    code: 'padding:0 8px;white-space:pre-wrap;word-break:break-all;vertical-align:top',
    '=': 'background:#ffffff', '-': 'background:#ffebe9', '+': 'background:#dafbe1',
    hlDel: 'background:#ff818266', hlAdd: 'background:#4ac26b66'
  };

  function codeHtml(r) {
    if (!r.hl || r.hl[0] === r.hl[1]) return esc(r.text);
    const [s, e] = r.hl, st = r.t === '-' ? ST.hlDel : ST.hlAdd;
    return esc(r.text.slice(0, s)) + '<span style="' + st + '">' + esc(r.text.slice(s, e)) + '</span>' + esc(r.text.slice(e));
  }

  const H = 'font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1f2328;';
  const sect = t => '<h2 style="' + H + 'font-size:18px;margin:18px 0 8px">' + t + '</h2>';
  const nm = f => f.name || '(unnamed file)';

  const keptHunks = f => f.hunks.filter(h => !h.removed);
  const keptFiles = files => files.filter(f => !f.removed);
  const stat = (f, t) => keptHunks(f).reduce((n, h) => n + h.rows.filter(r => r.t === t).length, 0);
  const emptyNote = f => f.hunks.length ? 'all change blocks removed' : 'no differences found';

  function statHtml(f) {
    return ' &mdash; <span style="color:#1a7f37"><strong>+' + stat(f, '+') + '</strong></span> <span style="color:#cf222e"><strong>\u2212' + stat(f, '-') + '</strong></span>';
  }

  function hunkHtml(hk, label) {
    let h = '<table style="' + ST.wrap + '"><thead><tr><th colspan="4" style="' + ST.hdr + '">Change ' + label +
      ' &mdash; before line ' + hk.oldStart + ', after line ' + hk.newStart + '</th></tr></thead><tbody>';
    for (const r of hk.rows) {
      const sign = r.t === '=' ? ' ' : r.t === '-' ? '\u2212' : '+';
      const sc = r.t === '-' ? 'color:#cf222e;' : r.t === '+' ? 'color:#1a7f37;' : 'color:#656d76;';
      h += '<tr style="' + ST[r.t] + '"><td style="' + ST.num + '">' + (r.oldNo || '') + '</td><td style="' + ST.num + '">' + (r.newNo || '') +
        '</td><td style="width:1%;padding:0 4px;' + sc + 'font-weight:bold;vertical-align:top">' + sign +
        '</td><td style="' + ST.code + '">' + codeHtml(r) + '</td></tr>';
    }
    return h + '</tbody></table>';
  }

  function fileDiffHtml(f) {
    const kept = keptHunks(f);
    let h = '<p style="' + H + 'margin:10px 0 6px"><strong>' + esc(nm(f)) + '</strong>';
    if (!kept.length) return h + ' &mdash; ' + emptyNote(f) + '.</p>';
    return h + statHtml(f) + '</p>' + kept.map((hk, n) => hunkHtml(hk, n + 1)).join('');
  }

  const reasonHtml = f => {
    const r = f.reason.trim();
    return '<p style="' + H + 'margin:0 0 18px"><strong>Reason for change:</strong> <span style="white-space:pre-wrap">' +
      (r ? esc(r) : '<em>No reason given</em>') + '</span></p>';
  };

  function reportHtml(files) {
    files = keptFiles(files);
    let h = '<div style="' + H + 'font-size:14px">';
    h += sect('File(s) changed') + '<ul style="margin:0 0 8px;padding-left:22px">' +
      files.map(f => '<li><strong>' + esc(nm(f)) + '</strong></li>').join('') + '</ul>';
    h += sect('What changed') + files.map(f => fileDiffHtml(f) + reasonHtml(f)).join('');
    return h + '</div>';
  }

  const rowText = r => (r.t === '=' ? ' ' : r.t) + r.text;

  function patchText(files) {
    return keptFiles(files).filter(f => keptHunks(f).length).map(f => {
      const lines = ['--- a/' + nm(f), '+++ b/' + nm(f)];
      keptHunks(f).forEach(hk => {
        lines.push('@@ -' + hk.oldStart + ',' + hk.oldLen + ' +' + hk.newStart + ',' + hk.newLen + ' @@');
        hk.rows.forEach(r => lines.push(rowText(r)));
      });
      return lines.join('\n');
    }).join('\n') + '\n';
  }

  function markdownText(files) {
    files = keptFiles(files);
    let md = '## File(s) changed\n\n' + files.map(f => '- **' + nm(f) + '**').join('\n') + '\n\n## What changed\n\n';
    files.forEach(f => {
      const kept = keptHunks(f);
      md += '**' + nm(f) + '**' + (kept.length ? ' (+' + stat(f, '+') + ' \u2212' + stat(f, '-') + ')' : ' \u2014 ' + emptyNote(f)) + '\n\n';
      kept.forEach((hk, n) => {
        md += 'Change ' + (n + 1) + ' \u2014 before line ' + hk.oldStart + ', after line ' + hk.newStart +
          '\n\n```diff\n' + hk.rows.map(rowText).join('\n') + '\n```\n\n';
      });
      md += '**Reason for change:** ' + (f.reason.trim() || '_No reason given_') + '\n\n';
    });
    return md + '\n';
  }

  const filesEl = $('files');

  function addFile() {
    const card = $('tpl').content.firstElementChild.cloneNode(true);
    const q = c => card.querySelector(c);
    const count = () => {
      q('.ca').textContent = split(q('.a').value).length + ' lines';
      q('.cb').textContent = split(q('.b').value).length + ' lines';
    };
    q('.a').addEventListener('input', count);
    q('.b').addEventListener('input', count);
    count();
    filesEl.appendChild(card);
    return card;
  }

  // One card per non-empty line in the file list; cards map to lines by position so typed content survives renames.
  function syncCards() {
    const names = $('list').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    while (filesEl.children.length < names.length) addFile();
    while (filesEl.children.length > names.length) filesEl.lastElementChild.remove();
    names.forEach((n, i) => { filesEl.children[i].querySelector('.name').textContent = n; });
  }

  function generate() {
    const ws = $('ws').checked;
    const prev = {};
    (last || []).forEach(f => { prev[f.name] = f.reason; });
    last = [...filesEl.children].map(card => {
      const q = c => card.querySelector(c).value;
      const name = card.querySelector('.name').textContent;
      const rows = diffLines(split(q('.a')), split(q('.b')), ws);
      return { name, reason: prev[name] || '', removed: false, hunks: buildHunks(rows) };
    });
    renderPreview();
    $('report-wrap').style.display = 'block';
    $('status').textContent = '';
    $('report-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function btn(text, onclick) {
    const b = document.createElement('button');
    b.textContent = text; b.onclick = onclick; b.style.cssText = 'padding:2px 10px;font-size:12px';
    return b;
  }

  // On-screen report: each file's diff blocks (removable) followed by its reason box. Copied output is built separately.
  function renderPreview() {
    const root = $('report');
    root.innerHTML = '';
    const bar = (parent, el) => { const d = document.createElement('div'); d.style.cssText = 'display:flex;gap:10px;align-items:center;margin:8px 0 4px'; d.append(...el); parent.appendChild(d); return d; };
    const note = t => { const e = document.createElement('span'); e.style.cssText = 'color:#656d76;font-size:13px'; e.textContent = t; return e; };
    const title = f => { const e = document.createElement('strong'); e.textContent = nm(f); e.style.cssText = 'font-size:15px'; return e; };

    last.forEach(f => {
      const sec = document.createElement('div');
      sec.style.cssText = 'margin:0 0 22px;padding-bottom:12px;border-bottom:1px solid #d0d7de';
      if (f.removed) {
        bar(sec, [title(f), note('removed from report'), btn('Restore file', () => { f.removed = false; renderPreview(); })]);
        root.appendChild(sec);
        return;
      }
      const head = bar(sec, [title(f), btn('Remove file', () => { f.removed = true; renderPreview(); })]);
      const stats = document.createElement('span');
      if (keptHunks(f).length) stats.innerHTML = statHtml(f).replace(' &mdash; ', ''); else stats.textContent = emptyNote(f);
      head.insertBefore(stats, head.lastChild);
      f.hunks.forEach((hk, n) => {
        const box = document.createElement('div');
        if (hk.removed) {
          bar(box, [note('Change ' + (n + 1) + ' removed from report'), btn('Restore', () => { hk.removed = false; renderPreview(); })]);
        } else {
          bar(box, [btn('Remove this block', () => { hk.removed = true; renderPreview(); })]);
          const t = document.createElement('div'); t.innerHTML = hunkHtml(hk, n + 1); box.appendChild(t);
        }
        sec.appendChild(box);
      });
      const lab = document.createElement('div');
      lab.textContent = 'Reason for change'; lab.style.cssText = 'font-weight:600;margin:6px 0 2px';
      const ta = document.createElement('textarea');
      ta.className = 'reason'; ta.placeholder = 'Why is this change needed?'; ta.value = f.reason;
      ta.style.cssText = 'height:70px;padding:8px 10px;background:#f6f7f9;color:#1f2328;border:1px solid #d0d7de;border-radius:6px;font:14px system-ui,sans-serif;white-space:pre-wrap';
      ta.addEventListener('input', () => { f.reason = ta.value; });
      sec.append(lab, ta);
      root.appendChild(sec);
    });
  }

  function flash(msg) {
    $('status').textContent = msg;
    setTimeout(() => { if ($('status').textContent === msg) $('status').textContent = ''; }, 2500);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
      document.execCommand('copy'); t.remove();
    }
    flash('Copied');
  }

  async function copyRich() {
    if (!last) return;
    const msg = 'Copied — paste into your change request';
    try {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([reportHtml(last)], { type: 'text/html' }),
        'text/plain': new Blob([markdownText(last)], { type: 'text/plain' })
      })]);
    } catch (e) {
      const tmp = document.createElement('div');
      tmp.innerHTML = reportHtml(last);
      document.body.appendChild(tmp);
      const sel = getSelection(), range = document.createRange();
      range.selectNodeContents(tmp); sel.removeAllRanges(); sel.addRange(range);
      document.execCommand('copy'); sel.removeAllRanges(); tmp.remove();
    }
    flash(msg);
  }

  $('go').onclick = generate;
  $('clear').onclick = () => { $('list').value = ''; filesEl.innerHTML = ''; syncCards(); $('report-wrap').style.display = 'none'; last = null; };
  $('copy-rich').onclick = copyRich;
  $('copy-md').onclick = () => last && copyText(markdownText(last));
  $('copy-patch').onclick = () => last && copyText(patchText(last));
  $('list').addEventListener('input', syncCards);
  syncCards();
})();
</script>
</body>
</html>
